# No ConfigMap, no NEXT_PUBLIC_* env vars here on purpose: those four
# backend URLs are inlined into the client JS bundle at `docker build`
# time (see k8s/README.md's "Building the dashboard image" section) - Pod
# env vars would be present but have zero effect on the browser bundle,
# which would be actively misleading to include.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-service
  namespace: code-review-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard-service
  template:
    metadata:
      labels:
        app: dashboard-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001  # matches the Dockerfile's `appuser` (--uid 1001 -
                         # node:22-slim's base image already owns uid 1000)
      containers:
        - name: dashboard-service
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/dashboard-service:latest
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
