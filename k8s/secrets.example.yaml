# Template for the real k8s/secrets.yaml (gitignored, never commit it).
#
# This phase has no Vault / External Secrets Operator / Sealed Secrets —
# see k8s/README.md's "Secrets" section for why that's a deliberate,
# documented gap rather than an oversight. Fill in every CHANGE_ME below,
# save as k8s/secrets.yaml, and `kubectl apply -f k8s/secrets.yaml`.
#
# The two PEM-bearing secrets (jwt-keypair, github-app-key) are easier and
# safer to create with `kubectl create secret generic --from-file=...` than
# by pasting PEM contents into YAML - see k8s/README.md for the exact
# commands. They're still listed here so the *shape* (which keys exist,
# which services consume them) is documented in git even when the real
# file isn't.
#
# Consistency requirements across these secrets (not enforced by
# Kubernetes - the operator filling this in must keep them in sync):
#   - Every DATABASE_URL below must embed the same password as
#     postgres-credentials' POSTGRES_PASSWORD.
#   - rabbitmq-credentials' RABBITMQ_URL must embed the same user/pass as
#     rabbitmq-server-credentials' RABBITMQ_DEFAULT_USER/PASS.
#   - internal-service-api-key's value is a single shared static bearer
#     token gating repository-service's /internal/* routes - the same
#     value repository-service, ai-analysis-service, and
#     notification-service all reference.

apiVersion: v1
kind: Secret
metadata:
  name: jwt-keypair
  namespace: code-review-platform
type: Opaque
stringData:
  private.pem: |
    CHANGE_ME - contents of services/auth-service/keys/private.pem
  public.pem: |
    CHANGE_ME - contents of services/auth-service/keys/public.pem
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-public-key
  namespace: code-review-platform
type: Opaque
stringData:
  public.pem: |
    CHANGE_ME - same contents as jwt-keypair's public.pem
---
apiVersion: v1
kind: Secret
metadata:
  name: github-app-key
  namespace: code-review-platform
type: Opaque
stringData:
  app_private_key.pem: |
    CHANGE_ME - contents of services/repository-service/keys/app_private_key.pem
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: code-review-platform
type: Opaque
stringData:
  RABBITMQ_URL: amqp://CHANGE_ME_USER:CHANGE_ME_PASS@rabbitmq:5672/
---
apiVersion: v1
kind: Secret
metadata:
  name: internal-service-api-key
  namespace: code-review-platform
type: Opaque
stringData:
  INTERNAL_SERVICE_API_KEY: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: code-review-platform
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://postgres:CHANGE_ME_PASS@postgres:5432/auth_service
  REDIS_URL: redis://redis:6379/0
  GITHUB_CLIENT_ID: CHANGE_ME
  GITHUB_CLIENT_SECRET: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: repository-service-secrets
  namespace: code-review-platform
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://postgres:CHANGE_ME_PASS@postgres:5432/repository_service
  REDIS_URL: redis://redis:6379/1
  GITHUB_APP_ID: CHANGE_ME
  GITHUB_WEBHOOK_SECRET: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-analysis-service-secrets
  namespace: code-review-platform
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://postgres:CHANGE_ME_PASS@postgres:5432/ai_analysis_service
  ANTHROPIC_API_KEY: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: review-service-secrets
  namespace: code-review-platform
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://postgres:CHANGE_ME_PASS@postgres:5432/review_service
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secrets
  namespace: code-review-platform
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://postgres:CHANGE_ME_PASS@postgres:5432/notification_service
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: code-review-platform
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: CHANGE_ME_PASS
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-server-credentials
  namespace: code-review-platform
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: CHANGE_ME_USER
  RABBITMQ_DEFAULT_PASS: CHANGE_ME_PASS
