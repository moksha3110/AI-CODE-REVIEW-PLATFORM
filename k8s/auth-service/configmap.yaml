apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: code-review-platform
data:
  ENV: production
  LOG_LEVEL: INFO
  JWT_PRIVATE_KEY_PATH: /secrets/jwt/private.pem
  JWT_PUBLIC_KEY_PATH: /secrets/jwt/public.pem
  JWT_ISSUER: auth-service
  JWT_AUDIENCE: code-review-platform
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  GITHUB_OAUTH_REDIRECT_URI: https://auth.crp.local/api/v1/auth/github/callback
  FRONTEND_URL: https://app.crp.local
  CORS_ALLOW_ORIGINS: '["https://app.crp.local"]'
