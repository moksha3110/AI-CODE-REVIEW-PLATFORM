# Replicas: 2 - stateless request/response service, no shared in-process
# state, trivially safe to run concurrently.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: code-review-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # matches the Dockerfile's `appuser` (--uid 1000) - k8s
                         # can't resolve a named USER to verify runAsNonRoot
                         # without an explicit numeric UID here.
      containers:
        - name: auth-service
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/auth-service:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: auth-service-secrets
          volumeMounts:
            - name: jwt-keypair
              mountPath: /secrets/jwt
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v1/readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: jwt-keypair
          secret:
            secretName: jwt-keypair
