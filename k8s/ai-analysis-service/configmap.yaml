apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-analysis-service-config
  namespace: code-review-platform
data:
  ENV: production
  LOG_LEVEL: INFO
  RABBITMQ_EXCHANGE: code_review_events
  RABBITMQ_CONSUME_QUEUE: ai_analysis.analysis_requested
  RABBITMQ_CONSUME_ROUTING_KEY: analysis.requested
  REPOSITORY_SERVICE_BASE_URL: http://repository-service:8000
  ANTHROPIC_MODEL: claude-opus-4-8
  ANTHROPIC_MAX_TOKENS: "4096"
