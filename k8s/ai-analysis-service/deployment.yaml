# Replicas: 2 - the RabbitMQ consumer is idempotent via a unique DB
# constraint on analysis_runs.push_event_id (see app/models/analysis_run.py),
# so concurrent consumers racing on redelivery converge onto the same row
# instead of double-processing. No public API - no CORS, no JWT
# verification, and deliberately no Ingress rule (see k8s/ingress.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-analysis-service
  namespace: code-review-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-analysis-service
  template:
    metadata:
      labels:
        app: ai-analysis-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # matches the Dockerfile's `appuser` (--uid 1000)
      containers:
        - name: ai-analysis-service
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/ai-analysis-service:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: ai-analysis-service-config
            - secretRef:
                name: ai-analysis-service-secrets
            - secretRef:
                name: rabbitmq-credentials
            - secretRef:
                name: internal-service-api-key
          readinessProbe:
            httpGet:
              path: /api/v1/readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
