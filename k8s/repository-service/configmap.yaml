apiVersion: v1
kind: ConfigMap
metadata:
  name: repository-service-config
  namespace: code-review-platform
data:
  ENV: production
  LOG_LEVEL: INFO
  JWT_PUBLIC_KEY_PATH: /secrets/jwt/public.pem
  JWT_ISSUER: auth-service
  JWT_AUDIENCE: code-review-platform
  GITHUB_APP_PRIVATE_KEY_PATH: /secrets/github/app_private_key.pem
  GITHUB_APP_SLUG: CHANGE_ME
  RABBITMQ_EXCHANGE: code_review_events
  CORS_ALLOW_ORIGINS: '["https://app.crp.local"]'
  FRONTEND_URL: https://app.crp.local
