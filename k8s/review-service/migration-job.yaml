apiVersion: batch/v1
kind: Job
metadata:
  name: review-service-migrate
  namespace: code-review-platform
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/review-service:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: review-service-config
            - secretRef:
                name: review-service-secrets
