# Scope, stated up front (matches this repo's habit of stating boundaries
# inline): every push/PR runs tests, frontend lint/typecheck/build, and a
# build-only Docker smoke check across all 6 services. On merge to main,
# it additionally builds+pushes real images (tagged with the short commit
# SHA) and deploys them to the live EKS cluster.
#
# Explicitly NOT built here: rollback automation, blue/green or canary
# deploys, Slack/email failure notifications, branch protection rules
# (a GitHub repo Settings item, not a workflow file), or a staging
# environment / per-branch namespace.
#
# If the EKS cluster has been `terraform destroy`-ed since the last
# session (see terraform/README.md's cost-driven teardown), the `deploy`
# job is expected to fail at the kubectl step - that's accepted, not a
# bug to work around.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-backend:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - repository-service
          - ai-analysis-service
          - review-service
          - notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: pytest -v

  test-frontend:
    name: Test (dashboard-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/dashboard-service/package-lock.json
      - working-directory: services/dashboard-service
        run: npm ci
      - name: Typecheck
        working-directory: services/dashboard-service
        run: npx tsc --noEmit
      - name: Lint
        working-directory: services/dashboard-service
        run: npm run lint
      - name: Build
        working-directory: services/dashboard-service
        # No real NEXT_PUBLIC_* values needed - lib/config.ts's localhost
        # defaults are enough for a build-succeeds check.
        run: npm run build

  docker-build-smoke:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - repository-service
          - ai-analysis-service
          - review-service
          - notification-service
          - dashboard-service
    steps:
      - uses: actions/checkout@v4
      - name: Build (no push - build-succeeds check only)
        # Catches Dockerfile bugs that break the build (e.g. the real
        # WORKDIR-vs-editable-install bug hit this project's own
        # Dockerfiles once, before any CI existed to catch it) on every
        # PR, without needing registry credentials.
        run: |
          if [ "${{ matrix.service }}" = "dashboard-service" ]; then
            docker build -f services/dashboard-service/Dockerfile \
              --build-arg NEXT_PUBLIC_AUTH_SERVICE_URL=http://localhost:8000 \
              --build-arg NEXT_PUBLIC_REPOSITORY_SERVICE_URL=http://localhost:8001 \
              --build-arg NEXT_PUBLIC_REVIEW_SERVICE_URL=http://localhost:8003 \
              --build-arg NEXT_PUBLIC_NOTIFICATION_SERVICE_URL=http://localhost:8004 \
              -t smoke/dashboard-service:ci .
          else
            docker build -f services/${{ matrix.service }}/Dockerfile -t smoke/${{ matrix.service }}:ci .
          fi

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, docker-build-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write # required for OIDC -> AWS, see terraform/github_actions_oidc.tf
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build and push backend images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          for svc in auth-service repository-service ai-analysis-service review-service notification-service; do
            docker build -f services/$svc/Dockerfile -t "$REGISTRY/$svc:$SHORT_SHA" .
            docker push "$REGISTRY/$svc:$SHORT_SHA"
          done

      - name: Build and push dashboard image
        # NEXT_PUBLIC_*_URL values are baked in at build time and tied to
        # whatever public hostnames the cluster's ALB currently has - see
        # k8s/README.md's sslip.io section. Kept as repo Variables,
        # updated by hand whenever the ALB is recreated - deliberately
        # not resolved dynamically here (same reasoning as this project's
        # other documented-manual-step decisions: real new failure mode
        # for marginal benefit if the Ingress/ALB doesn't exist yet).
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -f services/dashboard-service/Dockerfile \
            --build-arg NEXT_PUBLIC_AUTH_SERVICE_URL="${{ vars.NEXT_PUBLIC_AUTH_SERVICE_URL }}" \
            --build-arg NEXT_PUBLIC_REPOSITORY_SERVICE_URL="${{ vars.NEXT_PUBLIC_REPOSITORY_SERVICE_URL }}" \
            --build-arg NEXT_PUBLIC_REVIEW_SERVICE_URL="${{ vars.NEXT_PUBLIC_REVIEW_SERVICE_URL }}" \
            --build-arg NEXT_PUBLIC_NOTIFICATION_SERVICE_URL="${{ vars.NEXT_PUBLIC_NOTIFICATION_SERVICE_URL }}" \
            -t "$REGISTRY/dashboard-service:$SHORT_SHA" .
          docker push "$REGISTRY/dashboard-service:$SHORT_SHA"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Run migrations
        # Job names are unique per commit (immutable once created, unlike
        # a Deployment) - delete-then-recreate handles GitHub's "re-run
        # failed jobs" re-running the same SHA. Must complete before the
        # deploy step below - see k8s/README.md's documented apply order.
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          for svc in auth-service repository-service ai-analysis-service review-service notification-service; do
            job_name="${svc}-migrate-${SHORT_SHA}"
            kubectl delete job "$job_name" -n code-review-platform --ignore-not-found
            sed -e "s|<AWS_ACCOUNT_ID>\.dkr\.ecr\.<AWS_REGION>\.amazonaws\.com/${svc}:latest|${REGISTRY}/${svc}:${SHORT_SHA}|" \
                -e "s|name: ${svc}-migrate$|name: ${job_name}|" \
              "k8s/${svc}/migration-job.yaml" | kubectl apply -f -
            kubectl wait --for=condition=complete "job/${job_name}" -n code-review-platform --timeout=120s
          done

      - name: Deploy services
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          for svc in auth-service repository-service ai-analysis-service review-service notification-service dashboard-service; do
            kubectl set image "deployment/${svc}" "${svc}=${REGISTRY}/${svc}:${SHORT_SHA}" -n code-review-platform
            kubectl rollout status "deployment/${svc}" -n code-review-platform --timeout=120s
          done
