[project]
name = "shared-auth"
version = "0.1.0"
description = "Stateless JWT verification shared across all platform microservices"
requires-python = ">=3.11"
dependencies = [
    "pyjwt[crypto]>=2.8.0",
    "fastapi>=0.111.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared_auth*"]
